# WebDevBar fork release: Windows installer + Linux RPM, attached to a GitHub release.
#
# A SEPARATE file from upstream's publish.yaml on purpose. Our patches ride on
# the `webdevbar` branch, which is rebased onto each new upstream tag - editing
# upstream's workflow would produce a conflict on every rebase. This one is ours
# and never collides.
#
# Windows is built on a Windows runner because Tauri needs the MSVC toolchain;
# it cannot be cross-compiled from Linux.
name: "release-webdevbar"

on:
  workflow_dispatch:
  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: write # to upload release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            config: "src-tauri/tauri.bundle.windows.json"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            config: "src-tauri/tauri.bundle.linux.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      # Defender scans every file the build writes and roughly doubles the time.
      - name: Disable Windows Defender (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                                  librsvg2-dev patchelf rpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "latest"
          cache: "pnpm"

      - run: pnpm install

      # ---------------------------------------------------------------------
      # Bake the Solstice Clash sync key.
      #
      # Without it a shipped build cannot talk to the pool at all - sync simply
      # disables itself, which is the correct behaviour for a build with no key
      # rather than a failure. The key is NOT real authentication: it ships
      # inside a binary handed to collaborators and is extractable by anyone who
      # looks. What protects the pool is that every row is attributable to an
      # install UUID and any one install can be revoked on its own.
      #
      # Set the repository secret ADB_SYNC_KEY_BUILTIN to the value in
      # ~/.local/share/webdevbar/gameretro-adb-api.md
      # ---------------------------------------------------------------------
      - name: Bake the fork sync key
        env:
          FORK_KEY: ${{ secrets.ADB_SYNC_KEY_BUILTIN }}
        run: |
          DEST="src-tauri/src-python/adb_auto_player/games/afk_journey/services/solstice/_forkkey.py"
          if [ -n "$FORK_KEY" ]; then
            printf '"""Generated at build time. Never committed."""\n\nFORK_API_KEY = "%s"\n' \
              "$FORK_KEY" > "$DEST"
            echo "fork key baked in (${#FORK_KEY} chars)"
          else
            echo "::warning::ADB_SYNC_KEY_BUILTIN is not set - sync will be disabled in this build"
          fi

      - name: Download python-build-standalone
        env:
          PYTHON_VERSION: "3.13.9"
          TAG: "20251031"
          TARGET: ${{ matrix.target }}
        run: |
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${TAG}/cpython-${PYTHON_VERSION}+${TAG}-${TARGET}-install_only_stripped.tar.gz"
          DEST_DIR="src-tauri/pyembed"
          mkdir "$DEST_DIR"
          curl -L "$url" | tar -xz -C "$DEST_DIR"

          # Trim what the bundle does not need; these are large and pure weight.
          rm -rf "$DEST_DIR/python/include"
          rm -rf "$DEST_DIR/python/Lib/test" "$DEST_DIR/python/lib/python*/test"
          rm -rf "$DEST_DIR/python/Lib/ensurepip" "$DEST_DIR/python/lib/python*/ensurepip"
          rm -rf "$DEST_DIR/python/Lib/idlelib" "$DEST_DIR/python/lib/python*/idlelib"
          rm -rf "$DEST_DIR/python/Lib/turtledemo" "$DEST_DIR/python/lib/python*/turtledemo"

      - name: Install the project into the embedded python
        env:
          PYTAURI_STANDALONE: 1
          PYTHON_PATH: ${{ runner.os == 'Windows' && './src-tauri/pyembed/python/python.exe' || './src-tauri/pyembed/python/bin/python3' }}
        run: |
          uv pip install --exact --compile-bytecode \
            --python=${{ env.PYTHON_PATH }} ./src-tauri

      - name: Set build environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PYO3_PYTHON = (Resolve-Path -LiteralPath ".\src-tauri\pyembed\python\python.exe").Path
          echo "PYO3_PYTHON=$PYO3_PYTHON" >> $env:GITHUB_ENV

      - name: Set build environment (Linux)
        if: runner.os == 'Linux'
        env:
          PRODUCT_NAME: "AdbAutoPlayer"
        run: |
          PYO3_PYTHON=$(realpath ./src-tauri/pyembed/python/bin/python3)
          RUSTFLAGS=" \
            -C link-arg=-Wl,-rpath,\$ORIGIN/../lib/$PRODUCT_NAME/lib \
            -L $(realpath ./src-tauri/pyembed/python/lib)"
          echo "PYO3_PYTHON=$PYO3_PYTHON" >> $GITHUB_ENV
          echo "RUSTFLAGS=$RUSTFLAGS" >> $GITHUB_ENV

      - run: pnpm bundle-templates

      # `|| true`: tauri exits non-zero AFTER writing a perfectly good bundle
      # because it wants TAURI_SIGNING_PRIVATE_KEY for updater artifacts we do
      # not build. The real check is whether an artifact exists, below.
      - name: Build
        run: |
          pnpm tauri build \
            --config ${{ matrix.config }} \
            --config src-tauri/tauri.bundle.templates.json || true

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p dist-release
          found=0
          for pattern in \
            "target/release/bundle/rpm/*.rpm" \
            "target/release/bundle/deb/*.deb" \
            "target/release/bundle/nsis/*.exe" \
            "target/*/release/bundle/rpm/*.rpm" \
            "target/*/release/bundle/deb/*.deb" \
            "target/*/release/bundle/nsis/*.exe"
          do
            for f in $pattern; do
              [ -f "$f" ] || continue
              cp "$f" dist-release/
              echo "collected: $(basename "$f")"
              found=1
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no installer or package was produced"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adbautoplayer-${{ matrix.target }}
          path: dist-release/*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist-release/* --repo "${{ github.repository }}" --clobber
